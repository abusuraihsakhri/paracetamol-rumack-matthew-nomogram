[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paracetamol-rumack-matthew-nomogram"
version = "3.1.0"
description = "Rumack-Matthew 150-line reference calculator and legacy audit tools"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Dr. Abu Suraih Sakhri"}]
dependencies = ["fastapi>=0.111.0", "uvicorn>=0.30.0", "pydantic>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
paracetamol-nomogram = "rumack_matthew:main"
paracetamol-audit = "cli:main"

[tool.setuptools]
py-modules = ["rumack_matthew", "cli", "enrichment", "simulator"]

[tool.setuptools.packages.find]
include = ["agents*"]

[tool.pytest.ini_options]
testpaths = [".", "tests"]
python_files = ["test_*.py"]
