name: Tests and static checks
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test requirements
        run: python -m pip install -e ".[dev]"
      - name: Run Python tests
        run: python -m pytest -q
      - name: Check Python syntax
        run: python -m compileall -q rumack_matthew.py cli.py agents enrichment.py simulator.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser source and run JS tests
        run: |
          node --check web/nomogram.js
          node --test web/nomogram.test.cjs
